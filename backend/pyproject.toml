[project]
name = "quoteflow-backend"
version = "0.1.0"
description = "QuoteFlow AI backend — secure mobile-first SaaS for cleaning businesses"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "asyncpg>=0.29,<1.0",
    "aiosqlite>=0.20,<1.0",
    "alembic>=1.13,<2.0",
    "argon2-cffi>=23.1,<25.0",
    "python-multipart>=0.0.9,<1.0",
    "httpx>=0.27,<1.0",
    "reportlab>=4.2,<5.0",
    "python-docx>=1.1,<2.0",
    "svglib==1.5.1",  # 1.6.0+ hard-depends on rlpycairo->pycairo (no Linux wheels); breaks slim builds
    "stripe>=10.0,<12.0",
    "email-validator>=2.1,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends/Query/File are safe to call in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true