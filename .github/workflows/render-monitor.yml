name: Render Backend Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render health endpoint
        run: |
          set -e

          URL="https://quoteflow-backend-1nbn.onrender.com/api/health"

          echo "Pinging: $URL"

          response=$(curl \
            --silent \
            --show-error \
            --fail \
            --max-time 30 \
            "$URL")

          echo "Response:"
          echo "$response"

          if ! echo "$response" | grep -q '"status":"ok"'; then
            echo "Health check failed."
            exit 1
          fi

          echo "Render backend is healthy."
